<svg font-family="Segoe UI, Arial, sans-serif" viewBox="0 0 820 820" role="img" aria-labelledby="vrTitle vrDesc" xmlns="http://www.w3.org/2000/svg">
<title id="vrTitle">Verksamhetsringen – balanserat styrkort verksamhetsförst</title>
<desc id="vrDesc">Fyra perspektiv i medurs ordning. I centrum verksamhetscontroller med mål, avvikelser och intern kontroll. Streckad båge = lärdom tillbaka.</desc>
<defs>
  <marker id="vrPil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a3a5c"/></marker>
  <marker id="vrPilLjus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5a738c"/></marker>
  <linearGradient id="vrRing" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1f6fd1" stop-opacity="0.15"/>
    <stop offset="33%" stop-color="#c4651a" stop-opacity="0.12"/>
    <stop offset="66%" stop-color="#1a3a5c" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#2f7d5b" stop-opacity="0.15"/>
  </linearGradient>
</defs>
<rect width="820" height="820" fill="#ffffff"/>
<text x="410" y="36" font-size="22" font-weight="700" fill="#1a3a5c" text-anchor="middle">Verksamhetsringen</text>
<text x="410" y="58" font-size="14" fill="#5a738c" text-anchor="middle">Heldragna pilar = medurs 1–4 · Streckad båge = lärdom tillbaka</text>
<circle cx="410" cy="430" r="268" fill="url(#vrRing)" stroke="#d3e0ec" stroke-width="2"/>
<circle cx="410" cy="430" r="245" fill="none" stroke="#c5d4e4" stroke-width="1.5" opacity="0.65"/>
<circle cx="410" cy="430" r="112" fill="#17283b"/>
<text x="410" y="384" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Verksamhets-</text>
<text x="410" y="402" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">controller</text>
<line x1="328" y1="414" x2="492" y2="414" stroke="#4a6278" stroke-width="1"/>
<text x="410" y="430" font-size="11" fill="#b9d3ee" text-anchor="middle">Planera · styra · följa upp</text>
<text x="410" y="446" font-size="11" fill="#b9d3ee" text-anchor="middle">Indikatorer: mål och avvikelser</text>
<text x="410" y="462" font-size="11" fill="#ffcc99" text-anchor="middle">Intern kontroll och risk</text>
<text x="410" y="478" font-size="10" fill="#9eb4cc" text-anchor="middle">Gäller alla fyra perspektiven</text>
<rect x="278" y="78" width="264" height="118" rx="14" fill="#e6f1fb" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="410" y="108" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="middle">1  Vad händer här?</text>
<text x="410" y="132" font-size="13" fill="#17283b" text-anchor="middle">Viktiga processer</text>
<text x="410" y="152" font-size="13" fill="#17283b" text-anchor="middle">Verksamhet, struktur, kultur</text>
<text x="410" y="172" font-size="13" fill="#17283b" text-anchor="middle">Arbetsmiljö</text>
<rect x="562" y="356" width="228" height="118" rx="14" fill="#fbeee0" stroke="#c4651a" stroke-width="2.5"/>
<text x="676" y="386" font-size="16" font-weight="700" fill="#c4651a" text-anchor="middle">2  Lärande och innovation</text>
<text x="676" y="410" font-size="13" fill="#17283b" text-anchor="middle">Kompetens och lärande</text>
<text x="676" y="430" font-size="13" fill="#17283b" text-anchor="middle">HR som stöd</text>
<rect x="278" y="664" width="264" height="118" rx="14" fill="#e8edf4" stroke="#1a3a5c" stroke-width="2.5"/>
<text x="410" y="694" font-size="16" font-weight="700" fill="#1a3a5c" text-anchor="middle">3  Omvärld</text>
<text x="410" y="718" font-size="13" fill="#17283b" text-anchor="middle">”Kund”, medborgare, uppdragsgivare</text>
<text x="410" y="738" font-size="13" fill="#17283b" text-anchor="middle">Omgivning och samverkan</text>
<rect x="30" y="356" width="228" height="118" rx="14" fill="#e3f2ea" stroke="#2f7d5b" stroke-width="2.5"/>
<text x="144" y="386" font-size="16" font-weight="700" fill="#2f7d5b" text-anchor="middle">4  Finansiellt utfall</text>
<text x="144" y="410" font-size="13" fill="#17283b" text-anchor="middle">Historien i siffror</text>
<text x="144" y="430" font-size="13" fill="#17283b" text-anchor="middle">Budget och utfall</text>
<g fill="none" stroke="#1a3a5c" stroke-width="4.5" stroke-linecap="round">
<path d="M 525.0 213.7 A 245 245 0 0 1 637.2 338.2" marker-end="url(#vrPil)"/>
<path d="M 626.3 545.0 A 245 245 0 0 1 501.8 657.2" marker-end="url(#vrPil)"/>
<path d="M 295.0 646.3 A 245 245 0 0 1 182.8 521.8" marker-end="url(#vrPil)"/>
<path d="M 193.7 315.0 A 245 245 0 0 1 318.2 202.8" marker-end="url(#vrPil)"/>
</g>
<path d="M 236.8 256.8 A 188 188 0 0 0 473.4 193.3" fill="none" stroke="#5a738c" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#vrPilLjus)"/>
<text x="318" y="218" font-size="12" font-weight="600" fill="#5a738c" transform="rotate(-58 318 218)">Lärdom tillbaka</text>
<text x="410" y="800" font-size="11" fill="#5a738c" text-anchor="middle">Egen modell av Kent Lundgren.</text>
</svg>
